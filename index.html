            </div>
          </div>
          {!identityLocked&&(
            <div style={{background:"#76B90010",border:"1px solid #76B90030",borderRadius:6,padding:"10px 14px",margin:"8px 0",display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:12,color:"#76B900",fontWeight:600}}>👋 Who are you?</span>
              <select value={pendingIdentity} onChange={e=>setPendingIdentity(e.target.value)} style={{padding:"4px 8px",fontSize:12,flex:1,maxWidth:260}}>
                <option value="">— Select your name to vote and comment —</option>
                {MEMBERS.map(m=><option key={m.id} value={m.id}>{m.name} · {m.role}</option>)}
              </select>
              <button onClick={confirmIdentity} disabled={!pendingIdentity} style={{padding:"5px 14px",background:pendingIdentity?"#76B900":"#333",border:"none",borderRadius:5,color:pendingIdentity?"#000":"#666",fontWeight:700,fontSize:12,cursor:pendingIdentity?"pointer":"default"}}>Confirm</button>
            </div>
          )}
        </div>
      </div>

      <div style={{maxWidth:1400,margin:"0 auto",padding:"24px 28px"}}>

        {tab==="requirements" && (
          <div style={{display:"grid",gridTemplateColumns:activeReq?"1fr 440px":"1fr",gap:20,alignItems:"start"}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:16,flexWrap:"wrap"}}>
                {[{id:"all",label:"All",icon:"◈"},...DOMAINS].map(d=>{
                  const isAll=d.id==="all";
                  const active=activeDomain===d.id;
                  const stats=isAll?null:getDomainStats(d.id);
                  return(
                    <button key={d.id} onClick={()=>setActiveDomain(d.id)} style={{padding:"5px 12px",borderRadius:20,border:`1px solid ${active?"#76B900":"#222"}`,background:active?"#76B90015":"none",color:active?"#76B900":"#666",fontSize:12,cursor:"pointer",fontWeight:600,display:"flex",alignItems:"center",gap:4,transition:"all .15s"}}>
                      <span>{d.icon}</span>{d.label}
                      {stats&&stats.converging>0&&<span style={{background:"#76B900",color:"#000",borderRadius:10,padding:"0 5px",fontSize:9,fontWeight:700}}>{stats.converging}</span>}
                      {stats&&stats.contested>0&&<span style={{background:"#E74C3C",color:"#fff",borderRadius:10,padding:"0 5px",fontSize:9,fontWeight:700}}>!</span>}
                    </button>
                  );
                })}
                <button onClick={()=>setShowAddReq(!showAddReq)} style={{marginLeft:"auto",padding:"5px 14px",borderRadius:6,border:"1px solid #76B90050",background:"#76B90015",color:"#76B900",fontSize:12,cursor:"pointer",fontWeight:600}}>+ Add</button>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14,paddingLeft:2}}>
                <span style={{fontSize:10,color:"#444",textTransform:"uppercase",letterSpacing:1,fontFamily:"'DM Mono',monospace"}}>Priority:</span>
                {[["M","Must","#E74C3C"],["S","Should","#F39C12"],["C","Could","#3498DB"],["W","Won't","#95A5A6"]].map(([ltr,label,col])=>(
                  <span key={ltr} style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:11,color:"#555"}}>
                    <span style={{background:col+"22",color:col,border:`1px solid ${col}40`,borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:700,fontFamily:"'DM Mono',monospace"}}>{ltr}</span>
                    <span>{label}</span>
                  </span>
                ))}
              </div>

              {showAddReq&&(
                <div style={{background:"#111",border:"1px solid #76B90030",borderRadius:10,padding:16,marginBottom:16}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#76B900",marginBottom:10}}>New Requirement — added by {currentMember?.name}</div>
                  <div style={{display:"flex",gap:8,marginBottom:8}}>
                    <select value={newReqDomain} onChange={e=>setNewReqDomain(e.target.value)} style={{padding:"6px 10px",fontSize:12}}>
                      {DOMAINS.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
                    </select>
                    <select value={newReqPriority} onChange={e=>setNewReqPriority(e.target.value)} style={{padding:"6px 10px",fontSize:12,width:110}}>
                      {["M","S","C","W"].map(p=><option key={p} value={p}>{PRIORITY_LABELS[p]} ({p})</option>)}
                    </select>
                  </div>
                  <textarea value={newReqText} onChange={e=>setNewReqText(e.target.value)} placeholder="Requirement statement..." rows={2} style={{width:"100%",padding:"8px 10px",fontSize:13,marginBottom:6,resize:"vertical"}}/>
                  <textarea value={newReqRationale} onChange={e=>setNewReqRationale(e.target.value)} placeholder="Rationale (optional)..." rows={1} style={{width:"100%",padding:"8px 10px",fontSize:12,marginBottom:8,resize:"vertical"}}/>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={addRequirement} style={{padding:"6px 18px",background:"#76B900",border:"none",borderRadius:6,color:"#000",fontWeight:700,fontSize:12,cursor:"pointer"}}>Add</button>
                    <button onClick={()=>setShowAddReq(false)} style={{padding:"6px 14px",background:"none",border:"1px solid #333",borderRadius:6,color:"#666",fontSize:12,cursor:"pointer"}}>Cancel</button>
                  </div>
                </div>
              )}

              {(activeDomain==="all"?DOMAINS:DOMAINS.filter(d=>d.id===activeDomain)).map(domain=>{
                const domReqs=filtered.filter(r=>r.domain===domain.id);
                if(domReqs.length===0)return null;
                const stats=getDomainStats(domain.id);
                return(
                  <div key={domain.id} style={{marginBottom:24}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                      <span style={{fontSize:15}}>{domain.icon}</span>
                      <span style={{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1.5}}>{domain.label}</span>
                      <span style={{fontSize:11,color:"#444",fontFamily:"'DM Mono',monospace"}}>{stats.converging}/{stats.total}</span>
                      <div style={{flex:1,height:2,background:"#1a1a1a",borderRadius:1}}>
                        <div style={{height:2,width:`${(stats.converging/stats.total)*100}%`,background:"#76B900",borderRadius:1,transition:"width .5s"}}/>
                      </div>
                      {stats.contested>0&&<span style={{fontSize:11,color:"#E74C3C",fontWeight:600}}>⚠ {stats.contested} contested</span>}
                    </div>
                    {domReqs.map(req=>{
                      const conv=getConvergence(req);
                      const isActive=activeReq===req.id;
                      const voteCount=Object.values(req.votes).filter(Boolean).length;
                      return(
                        <div key={req.id} className="req-row" onClick={()=>setActiveReq(isActive?null:req.id)} style={{background:isActive?"#141420":"#0e0e18",border:`1px solid ${isActive?"#76B90040":"#1a1a1a"}`,borderRadius:8,padding:"11px 14px",marginBottom:5,cursor:"pointer",transition:"all .15s"}}>
                          <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                            <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#444",paddingTop:2,flexShrink:0,minWidth:34}}>{req.id}</span>
                            <span title={`${PRIORITY_LABELS[req.priority]} — ${req.priority === "M" ? "Non-negotiable" : req.priority === "S" ? "Strongly recommended" : req.priority === "C" ? "Nice to have" : "Out of scope"}`} style={{background:PRIORITY_COLORS[req.priority]+"22",color:PRIORITY_COLORS[req.priority],border:`1px solid ${PRIORITY_COLORS[req.priority]}40`,borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:700,fontFamily:"'DM Mono',monospace",flexShrink:0,cursor:"help"}}>{req.priority}</span>
                            <span style={{flex:1,fontSize:13,color:"#ccc",lineHeight:1.5}}>{req.text}</span>
                            <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                              <div style={{display:"flex",gap:2}}>
                                {Object.entries(req.votes).filter(([,v])=>v).slice(0,5).map(([mid,v])=>{
                                  const m=MEMBERS.find(x=>x.id===mid);
                                  return <span key={mid} title={`${m?.name}: ${v}`} style={{width:18,height:18,borderRadius:"50%",background:(m?.color||"#666")+"20",border:`1.5px solid ${v==="agree"?"#76B900":v==="challenge"?"#E74C3C":"#F39C12"}`,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:7,fontWeight:700,color:m?.color||"#aaa"}}>{m?.avatar||"?"}</span>;
                                })}
                                {voteCount>5&&<span style={{width:18,height:18,borderRadius:"50%",background:"#333",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:8,color:"#888"}}>+{voteCount-5}</span>}
                              </div>
                              <span style={{fontSize:11,color:conv.color,fontWeight:600,fontFamily:"'DM Mono',monospace",minWidth:80,textAlign:"right"}}>{conv.label}</span>
                              {req.discussions.length>0&&<span style={{fontSize:11,color:"#555"}}>({req.discussions.length})</span>}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>

            {activeReqData&&(
              <div style={{background:"#0e0e18",border:"1px solid #1e1e30",borderRadius:12,padding:20,position:"relative"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:"#555"}}>{activeReqData.id}</span>
                    <select value={activeReqData.priority} onChange={e=>{const p=e.target.value;setReqs(prev=>prev.map(r=>r.id===activeReqData.id?{...r,priority:p}:r));}} style={{background:PRIORITY_COLORS[activeReqData.priority]+"22",color:PRIORITY_COLORS[activeReqData.priority],border:`1px solid ${PRIORITY_COLORS[activeReqData.priority]}40`,borderRadius:4,padding:"2px 6px",fontSize:11,fontWeight:700,cursor:"pointer",outline:"none"}}>
                      {["M","S","C","W"].map(p=><option key={p} value={p} style={{background:"#1a1a1a",color:PRIORITY_COLORS[p]}}>{PRIORITY_LABELS[p]} ({p})</option>)}
                    </select>
                  </div>
                  <button onClick={()=>setActiveReq(null)} style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:18,lineHeight:1,padding:"0 4px"}}>×</button>
                </div>
                <p style={{fontSize:14,color:"#e0e0e0",lineHeight:1.6,marginBottom:10,fontWeight:500}}>{activeReqData.text}</p>
                {activeReqData.rationale&&<p style={{fontSize:12,color:"#555",lineHeight:1.5,marginBottom:14,fontStyle:"italic",borderLeft:"2px solid #222",paddingLeft:10}}>{activeReqData.rationale}</p>}
                {(()=>{const c=getConvergence(activeReqData);return(
                  <div style={{marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}>
                      <span style={{color:"#555"}}>Convergence</span>
                      <span style={{color:c.color,fontWeight:700}}>{c.label} · {c.pct}%</span>
                    </div>
                    <div style={{height:4,background:"#1a1a1a",borderRadius:2}}>
                      <div style={{height:4,width:`${c.pct}%`,background:c.color,borderRadius:2,transition:"width .5s"}}/>
                    </div>
                  </div>
                );})()}
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:11,color:"#555",marginBottom:8}}>Cast your vote as <strong style={{color:currentMember?.color}}>{currentMember?.name}</strong></div>
                  <div style={{display:"flex",gap:6}}>
                    {["agree","challenge","discuss"].map(v=>(
                      <button key={v} className={`vote-btn${activeReqData.votes[activeMember]===v?" "+v:""}`} onClick={e=>{e.stopPropagation();castVote(activeReqData.id,v);}} style={{flex:1,textTransform:"capitalize"}}>
                        {v==="agree"?"✓ Agree":v==="challenge"?"✕ Challenge":"? Discuss"}
                      </button>
                    ))}
                  </div>
                </div>
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:11,color:"#555",marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>All votes</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                    {MEMBERS.map(m=>{
                      const v=activeReqData.votes[m.id];
                      return(
                        <div key={m.id} title={`${m.name}: ${v||"no vote"}`} style={{display:"flex",alignItems:"center",gap:4,padding:"2px 7px",borderRadius:20,background:v?(v==="agree"?"#76B90012":v==="challenge"?"#E74C3C12":"#F39C1212"):"#111",border:`1px solid ${v?(v==="agree"?"#76B90035":v==="challenge"?"#E74C3C35":"#F39C1235"):"#1a1a1a"}`}}>
                          <span style={{width:14,height:14,borderRadius:"50%",background:m.color+"25",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:6,fontWeight:700,color:m.color}}>{m.avatar}</span>
                          <span style={{fontSize:10,color:v?(v==="agree"?"#76B900":v==="challenge"?"#E74C3C":"#F39C12"):"#333",fontFamily:"'DM Mono',monospace"}}>{v||"–"}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
                <div>
                  <div style={{fontSize:11,color:"#555",marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>Discussion</div>
                  <div style={{maxHeight:240,overflowY:"auto",marginBottom:8}}>
                    {activeReqData.discussions.length===0&&<p style={{fontSize:12,color:"#333",fontStyle:"italic",padding:"8px 0"}}>No comments yet — start the discussion</p>}
                    {activeReqData.discussions.map((d,i)=>{
                      const m=MEMBERS.find(x=>x.id===d.author);
                      const isEditing=editingComment&&editingComment.reqId===activeReqData.id&&editingComment.idx===i;
                      const isOwn=d.author===activeMember;
                      return(
                        <div key={i} style={{marginBottom:8,padding:"8px 10px",background:"#111",borderRadius:6,borderLeft:`2px solid ${m?.color||"#555"}`}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                            <span style={{fontSize:11,fontWeight:700,color:m?.color||"#aaa"}}>{m?.name||d.author}</span>
                            <span style={{fontSize:10,color:"#444"}}>{d.ts}{d.edited&&<span style={{color:"#444",fontStyle:"italic"}}> · edited</span>}</span>
                            {isOwn&&!isEditing&&(
                              <span style={{marginLeft:"auto",display:"flex",gap:4}}>
                                <button onClick={()=>setEditingComment({reqId:activeReqData.id,idx:i,text:d.text})} style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:11,padding:"0 4px"}} title="Edit">✎</button>
                                <button onClick={()=>{if(window.confirm("Delete this comment?"))deleteComment(activeReqData.id,i);}} style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:11,padding:"0 4px"}} title="Delete">✕</button>
                              </span>
                            )}
                          </div>
                          {isEditing
                            ? <div style={{display:"flex",gap:6,marginTop:4}}>
                                <textarea value={editingComment.text} onChange={e=>setEditingComment({...editingComment,text:e.target.value})} rows={2} style={{flex:1,padding:"6px 8px",fontSize:12,resize:"none"}}/>
                                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                                  <button onClick={()=>{saveEditComment(activeReqData.id,i,editingComment.text);setEditingComment(null);}} style={{padding:"4px 10px",background:"#76B900",border:"none",borderRadius:4,color:"#000",fontWeight:700,fontSize:11,cursor:"pointer"}}>Save</button>
                                  <button onClick={()=>setEditingComment(null)} style={{padding:"4px 10px",background:"none",border:"1px solid #333",borderRadius:4,color:"#666",fontSize:11,cursor:"pointer"}}>Cancel</button>
                                </div>
                              </div>
                            : <p style={{fontSize:12,color:"#aaa",lineHeight:1.5,margin:0}}>{d.text}</p>
                          }
                        </div>
                      );
                    })}
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <textarea value={newComment} onChange={e=>setNewComment(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&e.ctrlKey)addComment(activeReqData.id);}} placeholder="Add comment… (Ctrl+Enter)" rows={2} style={{flex:1,padding:"7px 10px",fontSize:12,resize:"none"}}/>
                    <button onClick={()=>addComment(activeReqData.id)} style={{padding:"6px 12px",background:"#76B900",border:"none",borderRadius:6,color:"#000",fontWeight:700,fontSize:12,cursor:"pointer",alignSelf:"flex-end"}}>Post</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

        {tab==="decisions"&&(
          <div style={{maxWidth:820}}>
            <p style={{fontSize:13,color:"#555",marginBottom:20}}>Decisions agreed by the working group. Record new decisions after each session.</p>
            {decisions.map(d=>(
              <div key={d.id} style={{background:"#0e0e18",border:"1px solid #1a1a1a",borderRadius:8,padding:"14px 18px",marginBottom:8,display:"flex",gap:14,alignItems:"flex-start"}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:"#76B900",flexShrink:0,marginTop:5}}/>
                <div style={{flex:1}}>
                  <p style={{fontSize:13,color:"#ccc",lineHeight:1.6,marginBottom:5}}>{d.text}</p>
                  <div style={{display:"flex",gap:10,fontSize:11,color:"#444"}}><span>{d.date}</span><span>·</span><span>{d.by}</span></div>
                </div>
                <span style={{background:d.status==="agreed"?"#76B90015":"#F39C1215",border:`1px solid ${d.status==="agreed"?"#76B90040":"#F39C1240"}`,color:d.status==="agreed"?"#76B900":"#F39C12",borderRadius:4,padding:"2px 8px",fontSize:10,fontWeight:700,flexShrink:0}}>{d.status==="agreed"?"AGREED":"OPEN"}</span>
              </div>
            ))}
            <div style={{marginTop:20,background:"#0e0e18",border:"1px solid #1a1a2a",borderRadius:8,padding:16}}>
              <div style={{fontSize:12,fontWeight:700,color:"#76B900",marginBottom:10}}>Record decision as <strong>{currentMember?.name}</strong></div>
              <textarea value={newDecision} onChange={e=>setNewDecision(e.target.value)} placeholder="Decision text…" rows={2} style={{width:"100%",padding:"8px 10px",fontSize:13,marginBottom:8,resize:"vertical"}}/>
              <button onClick={addDecision} style={{padding:"7px 20px",background:"#76B900",border:"none",borderRadius:6,color:"#000",fontWeight:700,fontSize:12,cursor:"pointer"}}>Record</button>
            </div>
          </div>
        )}

        {tab==="dashboard"&&(
          <div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:14,marginBottom:24}}>
              {DOMAINS.map(domain=>{
                const stats=getDomainStats(domain.id);
                const pct=Math.round((stats.converging/stats.total)*100)||0;
                return(
                  <div key={domain.id} className="domain-card" onClick={()=>{setTab("requirements");setActiveDomain(domain.id);}} style={{background:"#0e0e18",border:"1px solid #1a1a1a",borderRadius:10,padding:18,cursor:"pointer",transition:"border .15s"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                      <span style={{fontSize:18}}>{domain.icon}</span>
                      <span style={{fontSize:13,fontWeight:700,color:"#ccc"}}>{domain.label}</span>
                    </div>
                    <div style={{height:3,background:"#1a1a1a",borderRadius:2,marginBottom:10}}>
                      <div style={{height:3,width:`${pct}%`,background:pct>=70?"#76B900":pct>=40?"#F39C12":"#3498DB",borderRadius:2,transition:"width .5s"}}/>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                      <span style={{color:"#555"}}>{stats.converging}/{stats.total} converging</span>
                      {stats.contested>0&&<span style={{color:"#E74C3C"}}>⚠ {stats.contested}</span>}
                      <span style={{color:pct>=70?"#76B900":pct>=40?"#F39C12":"#3498DB",fontWeight:700}}>{pct}%</span>
                    </div>
                  </div>
                );
              })}
            </div>

            <div style={{background:"#0e0e18",border:"1px solid #1a1a1a",borderRadius:10,padding:20,marginBottom:20}}>
              <h3 style={{fontSize:12,fontWeight:700,color:"#666",textTransform:"uppercase",letterSpacing:1.5,marginBottom:14}}>Member Participation</h3>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:10}}>
                {MEMBERS.map(m=>{
                  const voted=reqs.filter(r=>r.votes[m.id]).length;
                  const agreed=reqs.filter(r=>r.votes[m.id]==="agree").length;
                  const challenged=reqs.filter(r=>r.votes[m.id]==="challenge").length;
                  const pct=Math.round((voted/reqs.length)*100);
                  return(
                    <div key={m.id} style={{padding:"10px 12px",background:"#111",borderRadius:8,border:`1px solid ${m.color}18`}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
                        <Avatar member={m.id} size={22}/>
                        <div>
                          <div style={{fontSize:12,fontWeight:600,color:"#ccc"}}>{m.name}</div>
                          <div style={{fontSize:10,color:"#444"}}>{m.role}</div>
                        </div>
                      </div>
                      <div style={{height:2,background:"#1a1a1a",borderRadius:1,marginBottom:5}}>
                        <div style={{height:2,width:`${pct}%`,background:m.color,borderRadius:1}}/>
                      </div>
                      <div style={{display:"flex",gap:8,fontSize:11}}>
                        <span style={{color:"#444"}}>{voted} voted</span>
                        <span style={{color:"#76B900"}}>✓{agreed}</span>
                        {challenged>0&&<span style={{color:"#E74C3C"}}>✕{challenged}</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {(()=>{
              const contested=reqs.filter(r=>Object.values(r.votes).includes("challenge"));
              if(contested.length===0)return null;
              return(
                <div style={{background:"#0e0e18",border:"1px solid #E74C3C30",borderRadius:10,padding:20}}>
                  <h3 style={{fontSize:12,fontWeight:700,color:"#E74C3C",textTransform:"uppercase",letterSpacing:1.5,marginBottom:12}}>⚠ Contested — Needs Discussion</h3>
                  {contested.map(r=>(
                    <div key={r.id} className="contested-row" onClick={()=>{setTab("requirements");setActiveDomain(r.domain);setActiveReq(r.id);}} style={{padding:"10px 14px",background:"#110a0a",borderRadius:6,marginBottom:6,cursor:"pointer",borderLeft:"2px solid #E74C3C",transition:"background .15s"}}>
                      <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#555",marginRight:8}}>{r.id}</span>
                      <span style={{fontSize:13,color:"#ccc"}}>{r.text}</span>
                    </div>
                  ))}
                </div>
              );
            })()}
          </div>
        )}

        {tab==="min-reqs"&&(
          <div style={{maxWidth:820}}>
            <div style={{background:"#76B90010",border:"1px solid #76B90030",borderRadius:10,padding:"16px 20px",marginBottom:24}}>
              <div style={{fontSize:10,fontFamily:"'DM Mono',monospace",color:"#76B900",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Registry Compliance Bar</div>
              <p style={{fontSize:13,color:"#888",lineHeight:1.6}}>For a toolchain to be listed in the HWInf Docs-as-Code Registry, it must satisfy all three requirements below. Everything else — folder structure, lint gates, taxonomy, versioning — is implementation detail left to the team. The tracker requirements are HWInf internal standards and are not prerequisites for registry listing.</p>
            </div>
            {[
              {
                num:"01",
                label:"Publish to Confluence",
                color:"#76B900",
                text:"Documentation produced by the toolchain must be published to nvidia.atlassian.net.",
                detail:"Required for Glean/NVSearch indexing and is a hard requirement from HWInf leadership. Additional publish targets (static site, PDF, external portals) are permitted alongside Confluence but do not substitute for it.",
                reqs:["PT-1"]
              },
              {
                num:"02",
                label:"Source Controlled",
                color:"#4A9EE0",
                text:"Documentation source must live in a version-controlled repository — GitLab or Perforce.",
                detail:"Docs must be reviewable, diffable, and tied to a commit history. The specific SCM system, branch strategy, and folder structure are left to the team.",
                reqs:["SC-1","SC-2"]
              },
              {
                num:"03",
                label:"Token Management & Author Tracking",
                color:"#F39C12",
                text:"CI service accounts must be team-owned, secrets must be stored in a secrets manager, and published Confluence pages must surface the human author — not the bot account.",
                detail:"Any API tokens used to publish docs must be owned by a team DL (not an individual) and stored in a secrets manager (not hardcoded in pipeline YAML). The published Confluence page must attribute the human git committer, not the CI service account.",
                reqs:["CI-12","CI-22","CI-18","CI-19"]
              }
            ].map(item=>(
              <div key={item.num} style={{background:"#0e0e18",border:`1px solid ${item.color}20`,borderRadius:10,padding:20,marginBottom:14}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:16}}>
                  <span style={{fontFamily:"'DM Mono',monospace",fontSize:28,fontWeight:700,color:item.color,opacity:.3,lineHeight:1,flexShrink:0}}>{item.num}</span>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                      <span style={{fontSize:15,fontWeight:700,color:"#fff"}}>{item.label}</span>
                      <span style={{background:item.color+"20",color:item.color,border:`1px solid ${item.color}40`,borderRadius:4,padding:"1px 8px",fontSize:10,fontWeight:700}}>REQUIRED</span>
                    </div>
                    <p style={{fontSize:13,color:"#ccc",lineHeight:1.6,marginBottom:8}}>{item.text}</p>
                    <p style={{fontSize:12,color:"#555",lineHeight:1.5,fontStyle:"italic",borderLeft:`2px solid ${item.color}30`,paddingLeft:10,marginBottom:10}}>{item.detail}</p>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {item.reqs.map(r=>(
                        <button key={r} onClick={()=>{setTab("requirements");setActiveReq(r);}} style={{background:"#ffffff08",border:"1px solid #2a2a2a",color:"#555",borderRadius:4,padding:"2px 8px",fontSize:10,fontFamily:"'DM Mono',monospace",cursor:"pointer"}}>↗ {r}</button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            ))}
            <div style={{background:"#0e0e18",border:"1px solid #1a1a1a",borderRadius:8,padding:"14px 18px",marginTop:8}}>
              <p style={{fontSize:12,color:"#444",lineHeight:1.6}}>Teams that want stricter standards — lint gates, taxonomy enforcement, staleness policies, versioning — can adopt those from the Requirements tab. Those are HWInf internal choices, not prerequisites for registry inclusion. The registry exists to surface compliant implementations so any team can choose a proven path.</p>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
