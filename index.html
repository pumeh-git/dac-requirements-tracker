<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans','Segoe UI',sans-serif;background:#0a0a0f;color:#e0e0e0}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
  .req-row:hover{background:#141420!important}
  .tab-btn{background:none;border:none;cursor:pointer;padding:8px 18px;font-size:13px;font-weight:600;transition:all .15s;font-family:inherit;border-bottom:2px solid transparent}
  .tab-btn.active{color:#76B900;border-bottom-color:#76B900}
  .tab-btn:not(.active){color:#666}
  .tab-btn:not(.active):hover{color:#aaa}
  .vote-btn{background:none;border:1px solid #333;color:#666;border-radius:4px;padding:3px 10px;font-size:11px;cursor:pointer;transition:all .15s;font-family:'DM Mono',monospace;font-weight:600}
  .vote-btn:hover{border-color:#555;color:#aaa}
  .vote-btn.agree{border-color:#76B900;color:#76B900;background:#76B90015}
  .vote-btn.challenge{border-color:#E74C3C;color:#E74C3C;background:#E74C3C15}
  .vote-btn.discuss{border-color:#F39C12;color:#F39C12;background:#F39C1215}
  input,textarea,select{background:#111;border:1px solid #2a2a2a;color:#e0e0e0;border-radius:6px;font-family:inherit;outline:none;transition:border .15s}
  input:focus,textarea:focus,select:focus{border-color:#76B900}
  select option{background:#1a1a1a}
  .domain-card:hover{border-color:#76B90040!important}
  .contested-row:hover{background:#1a1010!important}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const DATA_VERSION = "v36"; // bump this to force a localStorage reset
const STORAGE_KEY = "dac-wg-reqs";
const SYNC_URL = "https://dac-tracker-confluence.pnumeh.workers.dev"; // ← PASTE YOUR NEW WORKER URL HERE (e.g. https://dac-tracker-confluence.pnumeh.workers.dev)
const SYNC_INTERVAL_MS = 15000; // pull from sheet every 15 seconds

const MEMBERS = [
  { id:"philip",  name:"Philip Umeh",       role:"Driver · HWInf Docs/SCM",    avatar:"PU", color:"#76B900" },
  { id:"joshua",  name:"Joshua Hanson",      role:"Testgen / NVFarm / FRDB",    avatar:"JH", color:"#4A9EE0" },
  { id:"matt",    name:"Matt Madson",        role:"HWInf / Talos",              avatar:"MM", color:"#E06B4A" },
  { id:"ryan_r",  name:"Ryan Russell",       role:"DCS / DCSS / NVDocs",        avatar:"RR", color:"#9B59B6" },
  { id:"bryan",   name:"Bryan Hunt",         role:"HWInf App Standards",        avatar:"BH", color:"#E67E22" },
  { id:"george",  name:"George Stockfisch",  role:"SCM",                        avatar:"GS", color:"#1ABC9C" },
  { id:"jason",   name:"Jason Anderson",     role:"CI Team",                    avatar:"JA", color:"#E74C3C" },
  { id:"angela",  name:"Angela Kim",         role:"HWInf / Aura",               avatar:"AK", color:"#F39C12" },
  { id:"adrian",  name:"Adrian Kalaveshi",   role:"SCM",                        avatar:"AD", color:"#3498DB" },
  { id:"erik",    name:"Erik Elliott",        role:"SCM",                        avatar:"EE", color:"#27AE60" },
  { id:"sally",   name:"Sally Osborne",      role:"HWInf Leadership",           avatar:"SO", color:"#E91E8C" },
];

const DOMAINS = [
  { id:"source",     label:"Source Control",       icon:"⬡" },
  { id:"authoring",  label:"Authoring Format",      icon:"◈" },
  { id:"publishing", label:"Publishing",            icon:"◎" },
  { id:"cicd",       label:"CI/CD Quality",         icon:"⟳" },
  { id:"tokens",     label:"Token Management",      icon:"⬡" },
  { id:"authorship", label:"Authorship & Attribution", icon:"◑" },
  { id:"taxonomy",   label:"Taxonomy & Contract",   icon:"⊞" },
  { id:"versioning", label:"Versioning",            icon:"◷" },
  { id:"ai",         label:"AI Readiness",          icon:"◉" },
  { id:"clm",        label:"Content Lifecycle",      icon:"↻" },
  { id:"search",     label:"Search & Indexability",  icon:"⊙" },
];

const INITIAL_REQS = [
  // ── SOURCE CONTROL ───────────────────────────────────────────────────────
  {id:"SC-1",domain:"source",priority:"M",text:"Documentation must be co-located and versioned with the code it describes — the mechanism (same repo, monorepo subtree, or linked submodule) is left to the implementation",rationale:"Eliminates dual-maintenance; keeps docs versioned with code",votes:{},discussions:[],status:"open"},
  {id:"SC-2",domain:"source",priority:"M",text:"Both GitLab and Perforce must be supported as source control systems",rationale:"CI team and legacy systems have code in P4; cannot mandate migration",votes:{},discussions:[{author:"jason",text:"P4 has 20yr-old codebases still in active development — this is non-negotiable for CI team",ts:"Jun 5"}],status:"open"},
  {id:"SC-3",domain:"source",priority:"M",text:"Documentation source must be stored in a consistent, predictable location within the repository — a docs/ folder at repo root is the recommended convention, but implementations may use an equivalent structure provided it is consistently navigable by both humans and tooling",votes:{},discussions:[],status:"open"},
  {id:"SC-4",domain:"source",priority:"S",text:"Each doc set must have a defined ownership mechanism — a named owner or team alias that can receive automated freshness alerts and review requests; CODEOWNERS is the recommended approach for GitLab repos but any equivalent ownership signal is acceptable",rationale:"Enables automated freshness alerts and review routing",votes:{},discussions:[],status:"open"},
  {id:"SC-5",domain:"source",priority:"S",text:"In multi-service repositories, documentation ownership must be separable per service — implementations must ensure per-service doc sets can be independently owned, gated, and published without conflating content across services",rationale:"Shared docs folders conflate ownership and make per-service CI gating impossible",votes:{},discussions:[],status:"open"},
  {id:"SC-6",domain:"source",priority:"M",text:"Every participating repository must have a README or equivalent at the repo root that explicitly links to or describes how to navigate the documentation source — any contributor or consumer with no prior knowledge of the repo must be able to reach the docs in a single step",votes:{},discussions:[],status:"open"},
  {id:"SC-7",domain:"source",priority:"M",text:"Docs-as-Code implementations must use an organization-approved source control instance — gitlab-master.nvidia.com is the standard for GitLab-based workflows",votes:{},discussions:[],status:"open"},
  {id:"SC-8",domain:"source",priority:"S",text:"A standard MR description template must be defined for doc-only changes, covering: what changed, why, Confluence pages affected",rationale:"Reduces reviewer friction and enables automated changelog generation from MR descriptions",votes:{},discussions:[],status:"open"},
  {id:"SC-9",domain:"source",priority:"M",text:"Participating repositories must use a consistent, predictable default branch that shared CI templates can reference — main is the standard; existing implementations using an alternative default branch must document it for CI template compatibility",rationale:"Org consistency; required for shared CI include templates to reference a predictable branch",votes:{},discussions:[],status:"open"},
  {id:"SC-10",domain:"source",priority:"M",text:"Branch protection must be enabled on main: MR required, at least 1 approval, CI must pass before merge",rationale:"Prevents direct pushes that bypass lint and publish pipeline; protects Confluence content from bad publishes",votes:{},discussions:[],status:"open"},
  {id:"SC-11",domain:"source",priority:"S",text:"Doc-only MRs may be approved by any working group member, not exclusively the code owner of the modified service",rationale:"Requiring code-owner approval for doc changes creates bottlenecks; docs should have a broader reviewer pool",votes:{},discussions:[],status:"open"},
  {id:"SC-12",domain:"source",priority:"S",text:"Doc merge strategy must produce a clean, attributable commit history on the default branch — squash-merge is recommended; implementations may use alternative strategies provided the result is a traceable, non-noisy history",rationale:"Feature-branch doc work produces noisy intermediate commits; squash produces a single attributable commit per doc change",votes:{},discussions:[],status:"open"},
  {id:"SC-13",domain:"source",priority:"S",text:"Doc commits must use a structured, parseable message format to enable automated changelog generation — conventional commits (docs:, fix:, chore:) is recommended; implementations with an existing structured format may retain it provided it supports automated parsing",rationale:"Structured commit messages feed release note automation and doc debt dashboards",votes:{},discussions:[],status:"open"},
  {id:"SC-14",domain:"source",priority:"M",text:"Doc ownership must be assigned to a team or group alias, not a named individual — this applies regardless of the ownership mechanism used; individual-only ownership is non-compliant as it creates single points of failure when personnel change",rationale:"Individual CODEOWNERS entries become orphaned when team members leave or move — group aliases are resilient",votes:{},discussions:[],status:"open"},
  {id:"SC-15",domain:"source",priority:"M",text:"A staleness threshold must be agreed org-wide: doc files not updated within the threshold trigger an automated alert to the CODEOWNERS",rationale:"Without automated freshness enforcement, stale docs accumulate silently; proposal: 6 months for runbooks, 1 year for reference docs",votes:{},discussions:[],status:"open"},
  {id:"SC-16",domain:"source",priority:"S",text:"An archival policy must be defined for deprecated service docs: archive (read-only) with a deprecation banner, not delete",rationale:"Deleted docs lose institutional history; archiving preserves context while signalling content is no longer maintained",votes:{},discussions:[],status:"open"},
  {id:"SC-17",domain:"source",priority:"S",text:"A doc-debt label or Jira component must be established for tracking known doc gaps, stale pages, and orphaned content",rationale:"Without a formal tracking mechanism, doc debt is invisible and deprioritised across teams",votes:{},discussions:[],status:"open"},
  {id:"SC-18",domain:"source",priority:"S",text:"Orphaned doc detection (docs referencing deprecated code paths or services) must be part of the scheduled CI quality job",rationale:"As services evolve, runbooks and API references drift from reality; automated detection surfaces these before they cause operational incidents",votes:{},discussions:[],status:"open"},
  {id:"SC-19",domain:"source",priority:"M",text:"The Docs-as-Code standard must define required outcomes, not mandated tooling — teams may use any compliant toolchain provided they meet all pipeline, publish, and quality outcomes",rationale:"HWInf has diverse implementations (GitLab, Perforce, NVDocs RST, Talos, CI DaaS) — mandating specific tools would exclude valid existing implementations; outcome-based standards allow tooling diversity while maintaining consistency",votes:{},discussions:[{author:"ryan_r",text:"This is the principle that makes NVDocs a compliant implementation rather than an exception — it needs to be explicitly stated",ts:"Jun 9"},{author:"philip",text:"Aligned — the registry will surface compliant implementations so teams can choose a proven path rather than build from scratch",ts:"Jun 9"}],status:"open"},

  // ── AUTHORING FORMAT ─────────────────────────────────────────────────────
  {id:"AF-1",domain:"authoring",priority:"M",text:"Markdown (CommonMark) is the standard authoring format for HWInf Docs-as-Code",rationale:"Used by 6 of 7 existing implementations; widely supported; developer-friendly",votes:{},discussions:[{author:"ryan_r",text:"NVDocs uses RST — we need to explicitly document this as a supported exception, not a violation",ts:"Jun 5"}],status:"open"},
  {id:"AF-2",domain:"authoring",priority:"S",text:"RST-based workflows (NVDocs) are a supported exception where team requirements justify it",rationale:"NVDocs is production at DCSS; migration not viable short-term",votes:{},discussions:[{author:"ryan_r",text:"I'd push for this to be M, not S — we shouldn't treat a production system as a second-class citizen",ts:"Jun 5"}],status:"open"},
  {id:"AF-3",domain:"authoring",priority:"S",text:"Diagrams must be expressed as code (Mermaid, WaveDrom, WireViz) where practical",rationale:"Enables version control, CI validation, and AI readability of diagrams",votes:{},discussions:[{author:"matt",text:"Talos Kroki/Niolesk already handles WaveDrom/WireViz SVG generation — worth evaluating as shared org service",ts:"Jun 5"}],status:"open"},
  {id:"AF-4",domain:"authoring",priority:"M",text:"Binary diagram files (Visio, PNG) permitted where diagrams-as-code is not feasible",rationale:"Hardware schematics cannot always be converted to text-based formats",votes:{},discussions:[{author:"ryan_r",text:"AI-generated Visio-style diagrams from hardware schematics is a major gap — worth tracking separately",ts:"Jun 5"}],status:"open"},
  {id:"AF-5",domain:"authoring",priority:"M",text:"All rendered images and diagrams — regardless of format (PNG, SVG, generated diagram-as-code) — must be AI-readable and indexable: every image must carry alt text, a caption, and where applicable a machine-readable source reference",rationale:"The form of the image (binary vs code-generated) is irrelevant to the indexing requirement — Glean, NVSearch, and AI agents like DARA operate on metadata and text, not pixels; an SVG with no alt text is as opaque as a PNG. This principle applies at publish time, not just authoring time.",votes:{},discussions:[{author:"matt",text:"This is the right framing — it does not matter if it is Mermaid or a schematic PNG, if there is no alt text and caption it is invisible to every downstream system",ts:"Jun 9"},{author:"angela",text:"DARA depends on this — if images are not indexed, the freshness and accuracy signals we compute will miss anything diagram-heavy",ts:"Jun 9"}],status:"open"},
  {id:"AF-6",domain:"authoring",priority:"S",text:"Binary diagrams must carry a source metadata field (in front matter or sidecar) referencing the originating tool or file — enabling staleness tracking when the source changes",rationale:"A PNG with no provenance has no staleness signal; if the schematic it depicts changes, nothing alerts the doc owner. A source reference ties the diagram to its origin and enables automated freshness alerts",votes:{},discussions:[],status:"open"},
  {id:"AF-7",domain:"authoring",priority:"S",text:"Diagram-as-code tooling should be supported as a shared org service rather than per-team installs — Kroki/Niolesk (in use via Talos) is the reference implementation; Mermaid, WaveDrom, and WireViz are the supported renderers",rationale:"Per-team diagram renderer installs create fragmentation, version drift, and duplicated maintenance burden; a shared Kroki/Niolesk service provides consistent rendering across all implementations and reduces onboarding friction",votes:{},discussions:[{author:"matt",text:"Kroki/Niolesk is already handling WaveDrom/WireViz SVG generation in Talos — the question is whether this becomes a shared org service or stays team-local",ts:"Jun 9"}],status:"open"},

  // ── PUBLISHING ───────────────────────────────────────────────────────────
  {id:"PT-1",domain:"publishing",priority:"M",text:"All documentation must be published to Confluence (nvidia.atlassian.net)",rationale:"Non-negotiable per HWInf leadership; required for Glean/NVSearch indexing",votes:{},discussions:[{author:"sally",text:"This comes from Sharon — it's a hard requirement. Glean can't index what's not in Confluence.",ts:"Jun 5"},{author:"joshua",text:"We currently publish to K8s portal — we can add Confluence as a required additional target",ts:"Jun 5"}],status:"open"},
  {id:"PT-2",domain:"publishing",priority:"M",text:"Additional publish targets (static site, PDF, external) are permitted alongside Confluence",rationale:"NVDocs needs PDF; App Standards uses static site; DCS needs external publish capability",votes:{},discussions:[],status:"open"},
  {id:"PT-3",domain:"publishing",priority:"M",text:"Auto-generated Confluence pages must be marked and protected from manual overwrites",rationale:"Prevents content loss when pipeline re-publishes to the same page",votes:{},discussions:[],status:"open"},
  {id:"PT-4",domain:"publishing",priority:"S",text:"MR preview: publish to Confluence staging page on MR open, promote on merge",rationale:"GitLab FAQ and NVDocs both implement this — reduces publish errors significantly",votes:{},discussions:[{author:"philip",text:"My PoC currently lacks this — high priority for me to add once standard is agreed",ts:"Jun 5"}],status:"open"},
  {id:"PT-5",domain:"publishing",priority:"C",text:"Atlassian native Markdown-to-Confluence (~Sep 2026) to be evaluated as tooling replacement",rationale:"Could eliminate mark CLI dependency and simplify pipeline complexity org-wide",votes:{},discussions:[{author:"sally",text:"We have contacts on Atlassian product team — they demoed round-trip Markdown/Confluence editing",ts:"Jun 2"},{author:"ryan_r",text:"Would have helped us a lot — we had to build our own Confluence publish tooling",ts:"Jun 5"}],status:"open"},

  // ── CI/CD QUALITY ────────────────────────────────────────────────────────
  {id:"CI-1",domain:"cicd",priority:"M",text:"A shared GitLab CI include template for docs lint + publish must be provided",rationale:"Reduces per-team setup cost; Test Auto Pipeline already has templates/source-repo-ci.yml",votes:{},discussions:[],status:"open"},
  {id:"CI-2",domain:"cicd",priority:"M",text:"Documentation changes must be linted for structural quality on every merge request — markdownlint is recommended for Markdown implementations; RST-based (NVDocs) and other format implementations must use an equivalent linter; Perforce teams must implement an equivalent trigger",rationale:"Catches structural issues early; all teams align on shared .markdownlint.json config",votes:{},discussions:[],status:"open"},
  {id:"CI-3",domain:"cicd",priority:"S",text:"Vale + NVIDIA prose rules must run as part of the standard CI pipeline",rationale:"Only Philip's PoC has this today — brings style/tone consistency org-wide",votes:{},discussions:[],status:"open"},
  {id:"CI-4",domain:"cicd",priority:"M",text:"Link validation must run on every documentation change — broken internal and external links must be caught before content reaches Confluence; the validation tool and trigger mechanism are left to the implementation",rationale:"Broken links erode doc trust; Test Auto Pipeline already has validate_links.py",votes:{},discussions:[],status:"open"},
  {id:"CI-5",domain:"cicd",priority:"S",text:"Each implementation must define a documented, repeatable entry point for triggering its doc pipeline — make docs is one approach, but any equivalent documented trigger is acceptable provided it is consistent and shared with the working group",rationale:"CI DaaS proposes this as the standard entry point — consistent across all pipelines",votes:{},discussions:[],status:"open"},
  {id:"CI-6",domain:"cicd",priority:"S",text:"Phased release gate: soft gate (non-blocking) to hard gate (blocks release) on docs failures",rationale:"CI DaaS model — allows teams to ramp without disrupting existing release pipelines",votes:{},discussions:[{author:"ryan_r",text:"Strongly recommend distributed services architecture — don't build monolithic tooling around Confluence",ts:"Jun 5"},{author:"jason",text:"Hard gate (no docs = no release) should be the long-term target but we phase into it",ts:"Jun 5"}],status:"open"},
  {id:"CI-7",domain:"cicd",priority:"M",text:"Shared CI template references must be pinned to a specific version — floating references to a default branch are prohibited; the versioning format is left to the SCM system, and Perforce-based implementations must use an equivalent pinning mechanism",rationale:"Unpinned includes mean a template update can silently break every downstream repo simultaneously",votes:{},discussions:[],status:"open"},
  {id:"CI-8",domain:"cicd",priority:"S",text:"Lint and link-check jobs must run only on changed files under docs/** to keep MR pipelines fast",rationale:"Running full-corpus lint on every MR is slow and discourages adoption; scoped jobs run in seconds",votes:{},discussions:[],status:"open"},
  {id:"CI-9",domain:"cicd",priority:"M",text:"A Perforce-compatible pipeline template (or trigger bridge) for docs lint + publish must be owned by a named team",rationale:"P4 pipelines cannot use GitLab include templates directly; Jason flagged this as an open ownership gap at kick-off",votes:{},discussions:[],status:"open"},
  {id:"CI-10",domain:"cicd",priority:"S",text:"Pipeline secrets must never be hardcoded in CI configuration files — credentials must be retrieved from a secure secrets management system; the specific manager is left to the implementation and subject to working group approval",rationale:"Hardcoded tokens are a security risk and create per-repo maintenance burden when credentials rotate",votes:{},discussions:[],status:"open"},
  {id:"CI-11",domain:"cicd",priority:"S",text:"A token rotation policy must be defined for all CI service accounts used by the docs pipeline",rationale:"Long-lived unrotated tokens are a persistent security vulnerability; rotation cadence TBD (proposal: 90 days)",votes:{},discussions:[],status:"open"},
  {id:"CI-23",domain:"cicd",priority:"M",text:"A Docs-as-Code Registry must be maintained listing all compliant HWInf implementations with their toolchain, maturity level, and contact — teams adopting DaaC must register their implementation and may choose any listed pattern as their starting point",rationale:"A registry prevents duplicate effort, surfaces proven patterns for new adopters, provides working group visibility into adoption coverage, and is the onboarding ramp that makes compliance achievable without starting from scratch",votes:{},discussions:[{author:"philip",text:"The registry is a separate artifact from this tracker — it will list implementations like Test Auto Pipeline, NVDocs, Talos, GitLab FAQ as reference patterns teams can adopt",ts:"Jun 9"}],status:"open"},

  // ── TOKEN MANAGEMENT ─────────────────────────────────────────────────────
  {id:"CI-12",domain:"tokens",priority:"M",text:"CI service account tokens used for Confluence publishing must be stored securely and never committed to source control — the secrets management approach is left to the implementation but must be approved by the working group",rationale:"Hardcoded tokens in CI YAML are the #1 cause of credential leaks in pipeline-heavy orgs; any committed token must be treated as compromised",votes:{},discussions:[],status:"open"},
  {id:"CI-13",domain:"tokens",priority:"M",text:"A single shared Confluence publish token per working group must be provisioned — teams must not create individual service accounts for doc publishing",rationale:"Proliferating service accounts makes rotation, auditing, and revocation unmanageable at org scale",votes:{},discussions:[],status:"open"},
  {id:"CI-14",domain:"tokens",priority:"S",text:"Confluence API tokens must be rotated on a defined cadence (proposal: 90 days) with automated reminders to the token owner 14 days before expiry",rationale:"Unrotated tokens are a persistent vulnerability; reminder automation prevents surprise pipeline failures on rotation day",votes:{},discussions:[],status:"open"},
  {id:"CI-15",domain:"tokens",priority:"S",text:"Token scope must be least-privilege: Confluence publish tokens must have write access only to the designated DaaS space, not org-wide",rationale:"Over-permissioned tokens turn a compromised credential into an org-wide content risk",votes:{},discussions:[],status:"open"},
  {id:"CI-16",domain:"tokens",priority:"S",text:"A token ownership registry must be maintained covering: owner, expiry date, scope, and associated pipelines — stored in a designated Confluence page or internal tool",rationale:"Without a registry, token sprawl is invisible; no one knows what is expiring or who owns what until a pipeline fails",votes:{},discussions:[],status:"open"},
  {id:"CI-17",domain:"tokens",priority:"C",text:"Pipeline failures caused by expired or revoked tokens must surface a human-readable error identifying the token name and owner, not a raw 401",rationale:"Raw auth failures waste hours of debugging; named error messages route the issue to the right person immediately",votes:{},discussions:[],status:"open"},
  {id:"CI-22",domain:"tokens",priority:"M",text:"CI service account tokens must be owned by a team distribution list, not a named individual — the DL is the notification target for rotation reminders, expiry alerts, and pipeline failure emails",rationale:"Individual token ownership goes dark when that person leaves or is on vacation; a team DL ensures shared visibility, resilience to personnel changes, and consistent with the group-alias principle already required in CODEOWNERS (SC-14)",votes:{},discussions:[],status:"open"},

  // ── AUTHORSHIP ATTRIBUTION ───────────────────────────────────────────────
  {id:"CI-18",domain:"authorship",priority:"M",text:"Published Confluence pages must display the human git author, not the CI service account, as the page creator and last editor",rationale:"Service account authorship breaks ownership routing, Glean search attribution, staleness tracking, and audit trails — the bot name tells readers nothing",votes:{},discussions:[],status:"open"},
  {id:"CI-19",domain:"authorship",priority:"M",text:"The pipeline must explicitly write the git committer name and email into a Confluence page property or byline on every publish",rationale:"Confluence will not resolve this automatically — human authorship must be injected by the pipeline at publish time; this must be part of the shared CI template",votes:{},discussions:[],status:"open"},
  {id:"CI-20",domain:"authorship",priority:"S",text:"Last-modified attribution on Confluence pages must reflect the human who made the last git commit, not the publish bot timestamp",rationale:"Staleness alerts and freshness tracking depend on accurate human-authored timestamps; bot timestamps make every page appear perpetually fresh",votes:{},discussions:[],status:"open"},
  {id:"CI-21",domain:"authorship",priority:"S",text:"The ownership identity in source control and the author attribution on the published Confluence page must resolve to the same person or team — divergence is a governance failure regardless of the ownership mechanism used",rationale:"Divergent ownership between git and Confluence is a silent governance failure that breaks escalation paths and ownership audits",votes:{},discussions:[],status:"open"},

  // ── TAXONOMY & CONTRACT ──────────────────────────────────────────────────
  {id:"TX-1",domain:"taxonomy",priority:"M",text:"A minimum documentation contract must be defined per service or platform",rationale:"Ensures every service has: README, user guide, runbook, API/CLI ref, architecture overview",votes:{},discussions:[{author:"joshua",text:"Custom Docs Spec already defines this well — propose we adopt it as the org baseline rather than starting from scratch",ts:"Jun 5"}],status:"open"},
  {id:"TX-2",domain:"taxonomy",priority:"S",text:"Documentation must follow a consistent, agreed content taxonomy — getting-started/, how-to/, concepts/, reference/, troubleshooting/, runbooks/ is the recommended structure; implementations with established structures may propose an equivalent taxonomy for working group approval",rationale:"Custom Docs Spec prescribes this; 5 of 7 current implementations have no taxonomy today",votes:{},discussions:[],status:"open"},
  {id:"TX-3",domain:"taxonomy",priority:"M",text:"Confluence page trees and labels must be standardized across all teams",rationale:"Inconsistent page trees hurt Glean indexing and reader experience",votes:{},discussions:[],status:"open"},
  {id:"TX-4",domain:"taxonomy",priority:"M",text:"Docs must use stable machine-readable headings and consistent metadata for AI consumption",rationale:"Required for AI agents, chatbots, and search assistants to consume docs reliably",votes:{},discussions:[{author:"angela",text:"Agentic Doc Refresh depends on stable structure — critical for the auto-refresh pipeline to work",ts:"Jun 3"}],status:"open"},
  {id:"TX-5",domain:"taxonomy",priority:"M",text:"All doc files must carry machine-readable metadata covering at minimum: title, owner, last-reviewed date, and doc-type — YAML front matter is recommended for Markdown implementations; RST, XML-based, and other format implementations may use an equivalent metadata mechanism",rationale:"Front matter is the machine-readable contract that enables freshness tracking, ownership routing, and AI metadata extraction",votes:{},discussions:[],status:"open"},
  {id:"TX-6",domain:"taxonomy",priority:"S",text:"A standard Confluence label taxonomy must be agreed and enforced via CI: labels drive Glean faceting and NVSearch filters",rationale:"Without consistent labels, Glean search returns undifferentiated results; taxonomy makes labels actionable consistently across teams",votes:{},discussions:[],status:"open"},
  {id:"TX-7",domain:"taxonomy",priority:"S",text:"Auto-generated Confluence pages must have a stable, collision-resistant identity — implementations must ensure repeated publishes update the same page rather than creating duplicates, and that deep links remain stable across pipeline runs",rationale:"Multiple teams publishing to Confluence with ad-hoc page structures creates orphaned pages and broken links over time",votes:{},discussions:[],status:"open"},
  {id:"TX-8",domain:"taxonomy",priority:"M",text:"Auto-generated reference content must be accessible from the docs/reference/ folder, either by being written there directly or linked from it — the pipeline and Glean treat docs/ as the single entry point",rationale:"Generated content (API refs, CLI help, config schemas) that lands outside docs/ is invisible to the CI pipeline, Glean indexing, and the standard taxonomy; linking into docs/reference/ bridges the gap without mandating where tools write their output",votes:{},discussions:[],status:"open"},

  // ── VERSIONING ───────────────────────────────────────────────────────────
  {id:"VS-1",domain:"versioning",priority:"S",text:"Documentation versioning must be coupled to code release tags where applicable",rationale:"Test Auto Pipeline and NVDocs both do this — ensures docs stay aligned with releases",votes:{},discussions:[],status:"open"},
  {id:"VS-2",domain:"versioning",priority:"S",text:"A latest symlink or equivalent must always resolve to the most current stable version",rationale:"CI DaaS and Test Auto Pipeline both implement this pattern",votes:{},discussions:[],status:"open"},
  {id:"VS-3",domain:"versioning",priority:"M",text:"Single-page and FAQ-style docs without versioning are acceptable for appropriate content types",rationale:"Not all docs need versioning — GitLab FAQ pattern is valid for certain doc types",votes:{},discussions:[],status:"open"},
  {id:"VS-4",domain:"versioning",priority:"S",text:"A backport process must be defined for critical doc fixes that need to apply to multiple active release versions",rationale:"Without a backport process, urgent corrections (security notes, breaking-change warnings) only land in latest",votes:{},discussions:[],status:"open"},
  {id:"VS-5",domain:"versioning",priority:"S",text:"A doc retention policy must be defined: how many old versions are kept live, and when are they archived or deleted",rationale:"Unbounded version retention inflates Confluence space and degrades search quality with outdated results",votes:{},discussions:[],status:"open"},
  {id:"VS-6",domain:"versioning",priority:"S",text:"An exemption list for living docs (process docs, team norms, onboarding guides) that are unversioned by design must be formally documented",rationale:"Forcing version coupling on content that is intentionally evergreen creates false release coupling and unnecessary overhead",votes:{},discussions:[],status:"open"},
  {id:"VS-7",domain:"versioning",priority:"M",text:"Where version tags are used, doc versioning must align with code release tags — custom doc-only version schemes that decouple docs from code are non-compliant; implementations may use their existing version tag format provided doc versions map directly to code releases",rationale:"Custom version schemes (e.g. docs/2024-Q3) decouple docs from code and break tooling that reads release tags",votes:{},discussions:[],status:"open"},

  // ── AI READINESS ─────────────────────────────────────────────────────────
  {id:"AI-1",domain:"ai",priority:"M",text:"Documentation structure must enable AI agents to consume and reuse it reliably",rationale:"Structured, labeled content feeds authoring agents and chatbots; unstable headings break AI tooling",votes:{},discussions:[{author:"matt",text:"Proposal: AI agent skill that inspects a team's environment and recommends the right Docs-as-Code setup",ts:"Jun 5"}],status:"open"},
  {id:"AI-2",domain:"ai",priority:"S",text:"Auto-generated docs (API refs, CLI help, config schemas) must be included where feasible",rationale:"CI DaaS and NVDocs both do this; reduces manual authoring burden significantly",votes:{},discussions:[],status:"open"},
  {id:"AI-3",domain:"ai",priority:"S",text:"Agentic doc refresh workflows must be compatible with the standard CI pipeline",rationale:"Angela's Auto Doc Refresh project needs to hook into whatever CI pipeline is defined",votes:{},discussions:[{author:"angela",text:"Once we have a standard pipeline agreed, this becomes immediately actionable",ts:"Jun 3"}],status:"open"},
  {id:"AI-4",domain:"ai",priority:"S",text:"Source docs must avoid deeply nested heading structures (max H3 within a section) to ensure AI agents can parse and chunk content reliably",rationale:"LLMs and RAG pipelines perform poorly on deeply nested or inconsistently structured Markdown; flat, predictable headings improve retrieval quality",votes:{},discussions:[],status:"open"},
  {id:"AI-6",domain:"ai",priority:"M",text:"All images and diagrams published to Confluence must be indexable by Glean and consumable by AI agents — Confluence page publish must include alt text and caption for every image; pipeline must fail if images are published without alt text",rationale:"Glean and NVSearch index Confluence content, not source files — if an image lands in Confluence without alt text, it is permanently invisible to search and AI tooling regardless of what metadata exists in the source repo; enforcement must happen at publish time in the CI pipeline",votes:{},discussions:[{author:"angela",text:"This is the enforcement counterpart to AF-5 — AF-5 defines the authoring requirement, AI-6 enforces it at publish time where it actually matters for indexing",ts:"Jun 9"}],status:"open"},
  {id:"AI-5",domain:"ai",priority:"S",text:"Code examples in docs must be fenced with language identifiers (e.g. \`\`\`python, \`\`\`bash) for AI-assisted code extraction and syntax validation",rationale:"Language-tagged fences enable tooling to extract, validate, and reuse code examples; untagged blocks are opaque to agents",votes:{},discussions:[],status:"open"},

  // ── CONTENT LIFECYCLE MANAGEMENT ─────────────────────────────────────────
  {id:"CLM-1",domain:"clm",priority:"M",text:"Every doc set must have a named Content Owner (person or team DL) responsible for accuracy and currency",rationale:"Without a named owner, staleness alerts have no one to route to, AI-proposed refreshes have no approver, and deprecated docs have no one to archive them",votes:{},discussions:[{author:"angela",text:"DARA needs a Content Owner field to know who to route refresh MRs to — this is a hard dependency for the project",ts:"Jun 9"}],status:"open"},
  {id:"CLM-2",domain:"clm",priority:"M",text:"A review cadence must be defined per doc type: runbooks every 6 months, reference docs every 12 months, process docs evergreen unless triggered by a code change",rationale:"A single org-wide staleness threshold is too blunt; different content types decay at different rates and need appropriately calibrated review windows",votes:{},discussions:[],status:"open"},
  {id:"CLM-3",domain:"clm",priority:"M",text:"AI-proposed content refreshes (DARA or equivalent) must go through a human approval step before publishing to Confluence — auto-publish without review is prohibited",rationale:"AI-generated content can hallucinate or introduce subtle errors; a human gate before Confluence publish protects the integrity of org documentation at scale",votes:{},discussions:[{author:"angela",text:"DARA is designed with a human-in-the-loop model — this requirement formalises what the project already assumes",ts:"Jun 9"}],status:"open"},
  {id:"CLM-4",domain:"clm",priority:"S",text:"The Content Owner must be the approver for AI-generated refresh MRs — approval cannot be delegated to the CI service account or a generic bot reviewer",rationale:"Bot-approved AI content creates a fully automated publish loop with no human accountability; the Content Owner's approval is the quality gate",votes:{},discussions:[],status:"open"},
  {id:"CLM-5",domain:"clm",priority:"S",text:"A content health score must be defined per doc set combining: staleness against cadence, broken link count, and coverage against the TX-1 minimum documentation contract",rationale:"Individual signals (staleness alone, broken links alone) are insufficient; a composite health score gives Content Owners and working group leadership a single actionable metric",votes:{},discussions:[{author:"angela",text:"DARA already computes a freshness signal internally — aligning on a shared health score definition would let DARA feed the org-wide dashboard directly",ts:"Jun 9"}],status:"open"},
  {id:"CLM-6",domain:"clm",priority:"S",text:"When a service is deprecated, its Content Owner must explicitly archive or delete associated docs within an agreed window (proposal: 30 days) — orphaning docs without action is not permitted",rationale:"Deprecated service docs that remain live degrade search quality, mislead readers, and accumulate as invisible tech debt; a defined action window forces an explicit decision",votes:{},discussions:[],status:"open"},
  {id:"CLM-7",domain:"clm",priority:"C",text:"DARA-generated refresh suggestions must include a confidence score and a human-readable diff summary to aid Content Owner review decisions",rationale:"Reviewers approving AI-generated content need context to make fast, informed decisions; a confidence score and diff summary reduces review time and increases approval quality",votes:{},discussions:[{author:"angela",text:"This is already on the DARA roadmap — standardising the format here means it works consistently across all teams, not just early adopters",ts:"Jun 9"}],status:"open"},
  {id:"SI-1",domain:"search",priority:"M",text:"All Docs-as-Code generated content must result in Confluence pages that are indexable by Glean and NVSearch — regardless of the toolchain used to publish, the outcome is that content is discoverable via search",rationale:"The standard defines the outcome, not the pipeline — NVDocs, Test Auto Pipeline, GitLab FAQ, and any future implementation all have different publish flows, but the Glean indexability outcome is non-negotiable for all of them; teams must verify their target Confluence space is in Glean crawl scope",votes:{},discussions:[{author:"sally",text:"This is the whole point of requiring Confluence — if Glean cannot find it, the requirement is not satisfied regardless of how the content was published",ts:"Jun 9"},{author:"ryan_r",text:"NVDocs already publishes to Confluence and is in Glean scope — this is about ensuring new implementations don't default to uncrawled spaces",ts:"Jun 9"}],status:"open"},
  {id:"SI-2",domain:"search",priority:"M",text:"Every Confluence page produced by a DaaC pipeline must have a meaningful page title and at least one label — the mechanism for setting these is left to the implementation, but the outcome on the published page is required",rationale:"Glean faceting and NVSearch filters depend on Confluence metadata — an untitled or unlabeled page is undiscoverable regardless of its content quality; existing implementations that already set titles and labels are compliant by default",votes:{},discussions:[],status:"open"},
  {id:"SI-3",domain:"search",priority:"M",text:"Searchable content must exist as native Confluence page body text — PDFs and attachments are permitted as supplementary formats but cannot be the sole form of published content",rationale:"Glean indexes Confluence page bodies, not attachments; this does not prohibit PDF publishing (NVDocs, App Standards both need it) but requires that a text-readable page body exists alongside any binary format",votes:{},discussions:[{author:"ryan_r",text:"NVDocs publishes both — the Confluence page body has the searchable content and the PDF is the formatted deliverable. This requirement is already our practice.",ts:"Jun 9"}],status:"open"},
  {id:"SI-4",domain:"search",priority:"S",text:"Key ownership and freshness metadata (owner, doc-type, last-reviewed) must be surfaced in the published Confluence page — whether via page properties, labels, or page body, the mechanism is left to the implementation",rationale:"Glean and NVSearch cannot read source repo front matter — metadata must reach Confluence in some form to be searchable; existing implementations that embed this in page bodies or properties are compliant; the requirement is the outcome, not the injection mechanism",votes:{},discussions:[{author:"angela",text:"DARA needs owner and freshness signals to be visible in Confluence — how teams get them there is flexible, but they must be there",ts:"Jun 9"}],status:"open"},
  {id:"SI-5",domain:"search",priority:"S",text:"Published Confluence pages must use a consistent heading hierarchy (H1 title, H2 major sections, H3 subsections) to produce readable Glean search snippets — implementations may enforce this via lint, templates, or authoring convention",rationale:"Glean snippet generation uses heading structure for context windows; deeply nested headings produce truncated search previews; the enforcement mechanism is left to the implementation — lint rules, RST directives, or Confluence templates all satisfy the outcome",votes:{},discussions:[],status:"open"},
  {id:"SI-6",domain:"search",priority:"S",text:"Deprecated or archived content must be excluded from Glean indexing — implementations must define a deprecation signal (label, page status, or space archive) that removes stale pages from search results",rationale:"Stale indexed content degrades search quality and misleads readers; the deprecation mechanism varies by implementation (Confluence archive, label-based exclusion, space removal) but the outcome — stale content out of search — is the requirement",votes:{},discussions:[],status:"open"},
  {id:"SI-7",domain:"search",priority:"C",text:"Each registered implementation should define at least one representative search query that validates its content is discoverable — this is a self-certification step at registry registration, not a CI gate",rationale:"A lightweight discoverability check at registration time surfaces misconfigured spaces or missing labels before the implementation is listed as compliant; it is not intended as an ongoing CI requirement which would create overhead for existing implementations",votes:{},discussions:[],status:"open"},

  // ── CONTENT LIFECYCLE MANAGEMENT ─────────────────────────────────────────
  {id:"CLM-8",domain:"clm",priority:"C",text:"When DARA confidence falls below a defined threshold, the refresh must escalate to manual review rather than generating an MR — low-confidence suggestions must not enter the approval queue as-is",rationale:"A low-confidence AI refresh that enters the MR queue still costs reviewer time and creates risk if approved without scrutiny; escalation to manual review is the safer default",votes:{},discussions:[],status:"open"},];

const PRIORITY_COLORS = {M:"#E74C3C",S:"#F39C12",C:"#3498DB",W:"#95A5A6"};
const PRIORITY_LABELS = {M:"Must",S:"Should",C:"Could",W:"Won't"};

function Avatar({member,size=28}){
  const m=MEMBERS.find(x=>x.id===member)||{avatar:"?",color:"#666",name:member};
  return <span title={m.name} style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:size,height:size,borderRadius:"50%",background:m.color+"22",border:`1.5px solid ${m.color}`,color:m.color,fontSize:size*0.38,fontWeight:700,fontFamily:"'DM Mono',monospace",flexShrink:0,cursor:"default",userSelect:"none"}}>{m.avatar}</span>;
}

function App(){
  const [reqs,setReqs]=useState(()=>{try{const s=localStorage.getItem(STORAGE_KEY);const p=s?JSON.parse(s):null;if(p&&p.version===DATA_VERSION)return p.reqs||INITIAL_REQS;return INITIAL_REQS;}catch(e){return INITIAL_REQS;}});
  const [decisions,setDecisions]=useState(()=>{try{const s=localStorage.getItem(STORAGE_KEY);const p=s?JSON.parse(s):null;if(p&&p.version===DATA_VERSION)return p.decisions||INITIAL_DECISIONS;return INITIAL_DECISIONS;}catch(e){return INITIAL_DECISIONS;}});
  const [activeMember,setActiveMember]=useState(()=>{try{const id=localStorage.getItem("dac-wg-identity");return id&&MEMBERS.find(m=>m.id===id)?id:"philip";}catch(e){return "philip";}});
  const [identityLocked,setIdentityLocked]=useState(()=>{try{const id=localStorage.getItem("dac-wg-identity");return !!(id&&MEMBERS.find(m=>m.id===id));}catch(e){return false;}});
  const [pendingIdentity,setPendingIdentity]=useState("");
  const [activeDomain,setActiveDomain]=useState("all");
  const [activeReq,setActiveReq]=useState(null);
  const [newComment,setNewComment]=useState("");
  const [newDecision,setNewDecision]=useState("");
  const [newReqText,setNewReqText]=useState("");
  const [newReqRationale,setNewReqRationale]=useState("");
  const [newReqDomain,setNewReqDomain]=useState("source");
  const [newReqPriority,setNewReqPriority]=useState("M");
  const [tab,setTab]=useState("requirements");
  const [showAddReq,setShowAddReq]=useState(false);
  const [editingComment,setEditingComment]=useState(null); // {reqId, idx, text}

  const [syncStatus,setSyncStatus]=useState("idle"); // idle | syncing | synced | error
  const [lastSync,setLastSync]=useState(null);
  const isSyncing=useRef(false);

  // Save to localStorage on every change (instant, local)
  useEffect(()=>{
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:DATA_VERSION,reqs,decisions}));}catch(e){}
  },[reqs,decisions]);

  // Push to Google Sheets (debounced 2s after last change)
  const pushTimer=useRef(null);
  useEffect(()=>{
    if(!SYNC_URL)return;
    clearTimeout(pushTimer.current);
    pushTimer.current=setTimeout(()=>pushToSync(reqs,decisions),[2000]);
    return()=>clearTimeout(pushTimer.current);
  },[reqs,decisions]);

  // Pull from Google Sheets on interval
  useEffect(()=>{
    if(!SYNC_URL)return;
    pullFromSync();
    const interval=setInterval(pullFromSync,SYNC_INTERVAL_MS);
    return()=>clearInterval(interval);
  },[]);

  const pushToSync=async(r,d)=>{
    if(!SYNC_URL||isSyncing.current)return;
    try{
      setSyncStatus("syncing");
      await fetch(SYNC_URL,{method:"POST",body:JSON.stringify({
        action:"write_all",
        data:{reqs:r,decisions:d,version:DATA_VERSION}
      })});
      setSyncStatus("synced");
      setLastSync(new Date());
    }catch(e){setSyncStatus("error");}
  };

  const pullFromSync=async()=>{
    if(!SYNC_URL||isSyncing.current)return;
    isSyncing.current=true;
    try{
      const res=await fetch(`${SYNC_URL}?action=read`);
      const json=await res.json();
      if(json.ok&&json.data){
        if(json.data.version===DATA_VERSION){
          if(json.data.reqs)setReqs(json.data.reqs);
          if(json.data.decisions)setDecisions(json.data.decisions);
          setLastSync(new Date());
          setSyncStatus("synced");
        }
      }
    }catch(e){setSyncStatus("error");}
    finally{isSyncing.current=false;}
  };

  const castVote=(reqId,vote)=>{
    setReqs(prev=>prev.map(r=>{
      if(r.id!==reqId)return r;
      const current=r.votes[activeMember];
      const newVotes={...r.votes};
      if(current===vote){delete newVotes[activeMember];}
      else{newVotes[activeMember]=vote;}
      return{...r,votes:newVotes};
    }));
  };

  const addComment=(reqId)=>{
    if(!newComment.trim())return;
    const now=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
    setReqs(prev=>prev.map(r=>r.id===reqId?{...r,discussions:[...r.discussions,{author:activeMember,text:newComment.trim(),ts:now}]}:r));
    setNewComment("");
  };

  const deleteComment=(reqId,idx)=>{
    setReqs(prev=>prev.map(r=>r.id===reqId?{...r,discussions:r.discussions.filter((_,i)=>i!==idx)}:r));
  };

  const saveEditComment=(reqId,idx,newText)=>{
    if(!newText.trim())return;
    setReqs(prev=>prev.map(r=>r.id===reqId?{...r,discussions:r.discussions.map((d,i)=>i===idx?{...d,text:newText.trim(),edited:true}:d)}:r));
  };

  const addDecision=()=>{
    if(!newDecision.trim())return;
    const now=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    const m=MEMBERS.find(x=>x.id===activeMember);
    setDecisions(prev=>[...prev,{id:Date.now(),date:now,text:newDecision.trim(),by:m?.name,status:"agreed"}]);
    setNewDecision("");
  };

  const addRequirement=()=>{
    if(!newReqText.trim())return;
    const existing=reqs.filter(r=>r.domain===newReqDomain);
    const pfx=newReqDomain.slice(0,2).toUpperCase();
    const id=`${pfx}-${existing.length+1}`;
    setReqs(prev=>[...prev,{id,domain:newReqDomain,priority:newReqPriority,text:newReqText.trim(),rationale:newReqRationale.trim(),votes:{},discussions:[],status:"open"}]);
    setNewReqText("");setNewReqRationale("");setShowAddReq(false);
  };

  const resetAll=()=>{if(window.confirm("Reset all votes and comments to initial state?")){localStorage.removeItem(STORAGE_KEY);setReqs(INITIAL_REQS);setDecisions(INITIAL_DECISIONS);setActiveReq(null);}};

  const confirmIdentity=()=>{
    if(!pendingIdentity)return;
    localStorage.setItem("dac-wg-identity",pendingIdentity);
    setActiveMember(pendingIdentity);
    setIdentityLocked(true);
  };

  const getConvergence=(req)=>{
    const votes=Object.values(req.votes).filter(Boolean);
    if(votes.length===0)return{pct:0,label:"No votes",color:"#555"};
    const agree=votes.filter(v=>v==="agree").length;
    const challenge=votes.filter(v=>v==="challenge").length;
    const pct=Math.round((agree/MEMBERS.length)*100);
    if(challenge>0)return{pct,label:"Contested",color:"#E74C3C"};
    if(pct>=70)return{pct,label:"Converging",color:"#76B900"};
    if(pct>=40)return{pct,label:"Progressing",color:"#F39C12"};
    return{pct,label:"Needs input",color:"#3498DB"};
  };

  const getDomainStats=(domainId)=>{
    const dr=reqs.filter(r=>r.domain===domainId);
    return{total:dr.length,converging:dr.filter(r=>getConvergence(r).label==="Converging").length,contested:dr.filter(r=>Object.values(r.votes).includes("challenge")).length};
  };

  const filtered=activeDomain==="all"?reqs:reqs.filter(r=>r.domain===activeDomain);
  const totalConverging=reqs.filter(r=>getConvergence(r).label==="Converging").length;
  const activeReqData=reqs.find(r=>r.id===activeReq);
  const currentMember=MEMBERS.find(m=>m.id===activeMember);
  const overallPct=Math.round((totalConverging/reqs.length)*100);

  return (
    <div style={{fontFamily:"'DM Sans','Segoe UI',sans-serif",background:"#0a0a0f",minHeight:"600px",color:"#e0e0e0"}}>

      <div style={{background:"#0d0d1a",borderBottom:"1px solid #1a1a2e",padding:"0 28px",position:"relative"}}>
        <div style={{maxWidth:1400,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",paddingTop:16,paddingBottom:10}}>
            <div>
              <div style={{fontSize:10,fontFamily:"'DM Mono',monospace",color:"#76B900",letterSpacing:3,textTransform:"uppercase",marginBottom:4}}>NVIDIA · HWInf · Docs-as-Code Working Group</div>
              <h1 style={{fontSize:20,fontWeight:700,color:"#fff",letterSpacing:-0.5}}>Requirements Tracker</h1>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:10,color:"#555",marginBottom:3}}>Signed in as</div>
                {identityLocked
                  ? <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{padding:"5px 10px",fontSize:12,background:"#111",border:"1px solid #2a2a2a",borderRadius:6,color:currentMember?.color||"#aaa",fontWeight:600,minWidth:160,display:"inline-block"}}>{currentMember?.name}</span>
                      <button onClick={()=>{if(window.confirm("Switch identity? Your votes on this device will remain.")){localStorage.removeItem("dac-wg-identity");setIdentityLocked(false);setActiveMember("");setPendingIdentity("");}}} style={{background:"none",border:"1px solid #333",color:"#555",borderRadius:4,padding:"4px 8px",fontSize:10,cursor:"pointer"}}>Switch</button>
                    </div>
                  : <select value={pendingIdentity} onChange={e=>setPendingIdentity(e.target.value)} style={{padding:"5px 10px",fontSize:12,minWidth:160}}>
                      <option value="">— Select your name —</option>
                      {MEMBERS.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
                    </select>
                }
              </div>
              <div style={{background:"#76B90015",border:"1px solid #76B90040",borderRadius:8,padding:"8px 16px",textAlign:"center",minWidth:80}}>
                <div style={{fontSize:20,fontWeight:700,color:"#76B900",fontFamily:"'DM Mono',monospace"}}>{overallPct}%</div>
                <div style={{fontSize:9,color:"#76B900",opacity:.7,textTransform:"uppercase",letterSpacing:1}}>Convergence</div>
              </div>
              <div style={{background:"#ffffff08",border:"1px solid #222",borderRadius:8,padding:"8px 16px",textAlign:"center",minWidth:60}}>
                <div style={{fontSize:20,fontWeight:700,color:"#aaa",fontFamily:"'DM Mono',monospace"}}>{totalConverging}<span style={{fontSize:12,color:"#555"}}>/{reqs.length}</span></div>
                <div style={{fontSize:9,color:"#555",textTransform:"uppercase",letterSpacing:1}}>Agreed</div>
              </div>
            </div>
          </div>
          <div style={{display:"flex",gap:0,borderTop:"1px solid #1a1a2e",alignItems:"center"}}>
            {["requirements","decisions","dashboard","min-reqs"].map(t=>(
              <button key={t} className={`tab-btn${tab===t?" active":""}`} onClick={()=>setTab(t)} style={{textTransform:"capitalize"}}>{t==="min-reqs"?"Min Requirements":t}</button>

            <a href="https://claude.ai/design/p/2bb2295e-fb07-4f52-b4ba-d73e32ac13e0?file=index.html&via=share" target="_blank" rel="noopener noreferrer" style={{padding:"8px 18px",fontSize:13,fontWeight:600,color:"#666",textDecoration:"none",borderBottom:"2px solid transparent",transition:"all .15s",fontFamily:"inherit"}} onMouseOver={e=>{e.target.style.color="#aaa"}} onMouseOut={e=>{e.target.style.color="#666"}}>Docs-as-Code Registry ↗</a>

                <span style={{fontSize:10,color:"#555",fontFamily:"'DM Mono',monospace"}}>⚠ Local only</span>
